<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gyokusan｜影像剪輯作品集" />
    <title>Gyokusan｜Video Editor / Colorist</title>
    <script>if (location.protocol === 'file:') location.replace('https://gyokusan2026.github.io/gyokusan-portfolio/');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:ital,wght@0,500;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root{--paper:#fbfaf7;--ink:#292724;--soft:#f3f1ed;--accent:#5f554a;--muted:#696662}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:32px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:#3d3a35}.background-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.portfolio-card{max-width:1424px;margin:auto;padding-bottom:56px;border-radius:28px;overflow:hidden;background:var(--paper);box-shadow:0 24px 60px rgba(0,0,0,.25)}.content-width{max-width:1360px;margin:auto}.site-header{padding:22px 48px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px;font-family:'Noto Serif TC',serif;font-size:19px;font-weight:700}.brand svg{fill:var(--accent)}.site-header p{margin:0;color:var(--muted);font-size:12.5px}.hero{padding:20px 48px 48px}.hero h1,.about h2,.details h2{font-family:'Noto Serif TC',serif;font-style:italic;font-weight:600}.hero h1{text-align:right;font-size:46px;line-height:1.3;margin:0 0 24px}.hero-media{height:440px;position:relative;overflow:hidden;border-radius:20px;background:#222}.hero-media video{height:100%;width:100%;object-fit:cover;display:block}.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.3),transparent 50%)}.hero-caption{position:absolute;left:32px;bottom:32px;margin:0;color:#fff;font-size:14px;line-height:1.7;text-shadow:0 1px 8px #000}.now-playing{position:absolute;right:28px;top:28px;width:210px;padding:14px;border-radius:14px;background:rgba(251,250,247,.9);font-size:12px}.now-playing span{display:block;font-size:10px;opacity:.65;margin:2px 0 10px}.progress-track{height:4px;background:#ddd;border-radius:2px;overflow:hidden}.progress-track i{display:block;width:0;height:100%;background:var(--ink)}.transport{display:flex;gap:10px;margin-top:10px}.transport button{border:0;background:none;cursor:pointer}.about{padding:24px 48px 56px;display:grid;grid-template-columns:1.3fr 1fr;gap:48px}.about h2{font-size:32px;margin:0 0 16px}.about>div>p{margin:0;color:#625f5b;font-size:14px;line-height:1.8}.about-cards{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.portrait{height:220px;position:relative;overflow:hidden;border-radius:16px}.portrait img{width:100%;height:100%;object-fit:cover}.portrait div{position:absolute;left:14px;bottom:14px;color:#fff;z-index:1}.quote{min-height:220px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;border-radius:16px;background:#383532;color:#fbfaf7}.quote span{font-size:34px}.quote p{margin:0;font-family:'Noto Serif TC',serif;font-style:italic;font-size:16px}.showcase{padding:24px 48px 0}.kicker{font-size:11px;letter-spacing:.14em;color:#77736e}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}.filter{border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;background:transparent;font:13px inherit;cursor:pointer}.filter.active{background:var(--ink);color:#fff}.showcase-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:32px}.stage{position:relative;margin:auto;overflow:hidden;border-radius:20px;background:#eee}.stage.landscape{aspect-ratio:16/9}.stage.portrait{max-width:340px;aspect-ratio:9/16}.stage img,.stage iframe{width:100%;height:100%;border:0;object-fit:cover}.stage-meta{position:absolute;right:16px;top:16px;padding:10px 14px;border-radius:12px;background:rgba(251,250,247,.9);font-size:11px}.play{position:absolute;inset:0;border:0;background:transparent;color:white;font-size:58px;cursor:pointer;text-shadow:0 1px 6px #000}.thumbnail-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.thumbnail{position:relative;overflow:hidden;aspect-ratio:1;padding:0;border:0;border-radius:12px;background:none;cursor:pointer}.thumbnail.selected{outline:2.5px solid var(--accent);outline-offset:2px}.thumbnail img{width:100%;height:100%;object-fit:cover}.thumbnail span{position:absolute;left:8px;right:8px;bottom:6px;color:#fff;font-size:10px;text-align:left;text-shadow:0 1px 4px #000}.details{padding:28px;border-radius:20px;background:var(--soft)}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tag{border:1px solid #b5b1ac;border-radius:999px;padding:5px 12px;font-size:11px}.tag:first-child{background:var(--accent);color:#fff}.details h2{font-size:24px;margin:0 0 10px}.details p{font-size:13.5px;line-height:1.7;color:#625f5b}.details .label{font-size:11px;letter-spacing:.08em;color:#89857f}.details .notes{font-size:13px;line-height:1.75}footer{padding:56px 48px 0;color:#89857f;font-size:12px}@media(max-width:800px){body{padding:14px}.portfolio-card{border-radius:20px}.site-header,.hero,.about,.showcase,footer{padding-left:22px;padding-right:22px}.hero h1{font-size:40px}.hero-media{height:360px}.about{grid-template-columns:1fr;gap:28px}.showcase-grid{grid-template-columns:1fr}.details{padding:22px}}@media(max-width:480px){body{padding:0}.portfolio-card{border-radius:0}.site-header,.hero,.about,.showcase,footer{padding-left:18px;padding-right:18px}.site-header p{font-size:10px}.hero h1{font-size:34px}.hero-media{height:360px}.hero-caption{left:16px;bottom:16px;font-size:11px}.now-playing{left:14px;top:14px;right:auto;width:170px}.about-cards{gap:10px}.portrait,.quote{height:180px;min-height:180px}.quote{padding:15px}.quote p{font-size:13px}.filter{padding:7px 12px;font-size:12px}.thumbnail-grid{gap:6px}.thumbnail span{left:4px;right:4px;bottom:4px;font-size:8px}.details{padding:18px}}
    </style>
  </head>
  <body>
    <video class="background-video" id="backgroundVideo" src="assets/bg-video.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
    <main class="portfolio-card">
      <header class="site-header content-width">
        <a class="brand" href="#top" aria-label="Gyokusan 首頁"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><circle cx="10" cy="3" r="2.6" opacity=".55"/><circle cx="10" cy="17" r="2.6" opacity=".55"/><circle cx="3" cy="10" r="2.6" opacity=".55"/><circle cx="17" cy="10" r="2.6" opacity=".55"/></svg><span>Gyokusan</span></a>
        <p>Video Editor / Colorist</p>
      </header>

      <section class="hero content-width" id="top">
        <h1>光影,節奏,<br />與慢慢說完的故事</h1>
        <div class="hero-media">
          <video id="heroVideo" src="assets/hero-video.mp4" autoplay muted loop playsinline></video>
          <div class="hero-shade"></div>
          <p class="hero-caption">這不只是一支影片 — 這是我剪輯的日常。<br />一段掌握節奏、把畫面說清楚的過程。</p>
          <div class="now-playing">
            <strong>舊情雨MV</strong><span>MV製作 · 04:29</span>
            <div class="progress-track"><i id="heroProgress"></i></div>
            <div class="transport"><button id="skipBack" aria-label="倒退十秒">◀</button><button id="muteToggle" aria-label="開啟聲音"><span id="soundIcon">♩</span></button><button id="skipForward" aria-label="前進十秒">▶</button></div>
          </div>
        </div>
      </section>

      <section class="about content-width" id="about">
        <div><h2>分類,是為了<br />對上頻率</h2><p>每一支影片有不同的節奏與情緒 —<br />品牌廣告要俐落<br />產品影片要清晰<br />生活記錄要真實<br />MV 要呼應音樂的呼吸</p></div>
        <div class="about-cards"><div class="portrait"><img src="assets/portrait-01.jpg" alt="Gyokusan" /><div><span>◯</span>Gyokusan</div></div><div class="quote"><span>“</span><p>剪輯,是把時間<br />重新排序的手藝。</p></div></div>
      </section>

      <section class="showcase content-width" id="showcase">
        <p class="kicker">Portfolio · 影像剪輯作品集</p>
        <div class="filters" id="filters" aria-label="作品分類"></div>
        <div class="showcase-grid"><div class="work-area"><div class="stage" id="stage"></div><div class="thumbnail-grid" id="thumbnailGrid"></div></div><aside class="details" id="details"></aside></div>
      </section>
      <footer class="content-width">© 2026 Gyokusan</footer>
    </main>
    <style>@media(min-width:481px){.stage.portrait{max-width:520px!important}}</style>
    <script src="script.js?v=20260727-9"></script>
  </body>
</html>
